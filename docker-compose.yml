services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campusconnect
      MYSQL_USER: campusconnect
      MYSQL_PASSWORD: campusconnect-dev
      MYSQL_ROOT_PASSWORD: campusconnect-root-dev
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "campusconnect",
          "--password=campusconnect-dev"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
